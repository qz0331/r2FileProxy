services:
  r2proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: r2proxy:latest
    container_name: r2proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    env_file:
      - .env
    environment:
      - SERVER_PORT=18080
      - DATABASE_URL=/app/data/r2proxy.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
