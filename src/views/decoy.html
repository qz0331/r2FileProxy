<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网络检测</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
        color: #4b5563;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    .box {
        text-align: center;
        padding: 24px;
    }
    .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 18px;
        border: 3px solid #e5e7eb;
        border-top-color: #9ca3af;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    .latency {
        font-size: 15px;
        letter-spacing: .02em;
        font-variant-numeric: tabular-nums;
        color: #6b7280;
    }
    .hint {
        margin-top: 10px;
        font-size: 12px;
        color: #9ca3af;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <div class="latency" id="latency">延迟检测中…</div>
        <div class="hint">网络诊断中</div>
    </div>
    <script>
        (function () {
            var el = document.getElementById('latency');
            var base = 20 + Math.floor(Math.random() * 60);

            function tick() {
                base += Math.floor(Math.random() * 21) - 10;
                if (base < 8) base = 8;
                if (base > 320) base = 320;
                el.textContent = '延迟 ' + base + ' ms';
            }

            tick();
            setTimeout(tick, 600);
            setInterval(tick, 1000 + Math.floor(Math.random() * 1000));
        })();
    </script>
</body>
</html>
