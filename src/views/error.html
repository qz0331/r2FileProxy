<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <title>{{ .title }} · R2 Proxy</title>
  <link rel="stylesheet" href="{{ .basePath }}/static/app.css?v=e3b43c1e">
  <script>
    // 主题初始化：在样式渲染前应用，避免深色模式闪白
    (function () {
      try {
        var t = localStorage.getItem('r2proxy-theme') || 'auto';
        if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>

</head>
<body>
  <main class="page page-narrow" style="min-height:100vh;display:grid;place-items:center">
    <div class="card" style="width:100%;max-width:420px">
      <div class="card-body" style="text-align:center;padding:34px 24px">
        <div class="empty-icon" style="margin:0 auto 14px;width:56px;height:56px;border-radius:18px;background:var(--danger-soft);border-color:rgba(180,35,24,.16);color:var(--danger)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>
        </div>
        <h1 style="font-size:20px;font-weight:750;letter-spacing:-.01em">{{ .title }}</h1>
        <p class="hint" style="margin-top:8px;font-size:13.5px">{{ .message }}</p>
        <a class="btn btn-primary btn-block" style="margin-top:22px" href="{{ .basePath }}/login">前往登录</a>
      </div>
    </div>
  </main>
</body>
</html>
