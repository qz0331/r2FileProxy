<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <title>{{ .title }} · R2 Proxy</title>
  <link rel="stylesheet" href="{{ .basePath }}/static/app.css?v=e3b43c1e">
  <script>
    // 主题初始化：在样式渲染前应用，避免深色模式闪白
    (function () {
      try {
        var t = localStorage.getItem('r2proxy-theme') || 'auto';
        if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>

</head>
<body>
  <main class="page page-narrow">

    <section class="card" id="upload-card">
      <div class="card-head">
        <div class="card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/></svg>
          通过签名链接上传
        </div>
      </div>
      <div class="card-body">
        <div class="field" style="margin-bottom:14px">
          <label class="label" for="put-url">PUT 地址</label>
          <input class="input mono" id="put-url" type="url" value="{{ .putURL }}" placeholder="https://xxx.r2.cloudflarestorage.com/...?X-Amz-Signature=..." spellcheck="false" autocomplete="off">
          <p class="hint">把创建者给你的 Sign PUT 链接粘贴到这里；链接中已包含签名，无需额外密码。</p>
        </div>

        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖拽文件上传">
          <span class="dz-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5-5 5 5"/><path d="M12 5v12"/></svg>
          </span>
          <div class="dz-title">点击选择文件，或拖拽到此处</div>
          <div class="dz-hint" id="upload-limit-hint">选择一个文件 · 上传后回到文件列表点击“确认上传”即可入库</div>
          <input type="file" id="file-input" hidden>
        </div>

        <div id="upload-list" class="list" style="margin-top:6px"></div>

        <div class="alert alert-info" style="margin-top:14px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg>
          <div>浏览器直传可能受 R2 的 CORS 限制；若失败会自动改用本站中转上传（需要链接创建者未过期）。</div>
        </div>
      </div>
    </section>
  </main>

  <script src="{{ .basePath }}/static/qrcode.min.js?v=6e6189e2"></script>
  <script src="{{ .basePath }}/static/app.js?v=20651110"></script>
  <script>
    const BASE_PATH = '{{ .basePath }}';
    const urlInput = document.getElementById('put-url');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const uploadList = document.getElementById('upload-list');

    R2.uploadLimit().then((limit) => {
      const el = document.getElementById('upload-limit-hint');
      if (el && limit > 0) el.textContent += ' · 单文件最大 ' + R2.formatSize(limit);
    });

    function addRow(file) {
      const row = document.createElement('div');
      row.className = 'upload-item';
      row.innerHTML = '<div class="upload-item-head"><span class="name"></span><span class="pct">等待中</span></div><div class="progress"><span></span></div>';
      row.querySelector('.name').textContent = file.name + ' · ' + R2.formatSize(file.size);
      uploadList.prepend(row);
      return {
        progress(p) {
          row.querySelector('.progress > span').style.width = Math.round(p * 100) + '%';
          row.querySelector('.pct').textContent = Math.round(p * 100) + '%';
        },
        done(text, ok) {
          row.querySelector('.pct').textContent = text;
          row.querySelector('.progress > span').style.background = ok ? 'linear-gradient(90deg,#12b76a,#039855)' : 'linear-gradient(90deg,#f97066,#d92d20)';
        },
      };
    }

    async function uploadOne(file) {
      const tooBig = await R2.checkUploadSize(file);
      if (tooBig) { R2.toast(file.name + '：' + tooBig, 'error'); return; }
      const target = urlInput.value.trim();
      if (!target) { R2.toast('请先粘贴 PUT 地址', 'error'); return; }
      if (!/^https:\/\//i.test(target)) { R2.toast('PUT 地址必须是 https', 'error'); return; }

      const ui = addRow(file);
      try {
        // 1) 先走本站中转，规避 R2 CORS 限制
        const proxyURL = BASE_PATH + '/put/upload?url=' + encodeURIComponent(target) + '&filename=' + encodeURIComponent(file.name);
        const result = await R2.postFile(proxyURL, file, (p) => ui.progress(p * 0.98));
        if (!result || result.success === false) throw new Error((result && result.error && result.error.message) || '上传失败');
        ui.progress(1);
        ui.done('完成', true);
        R2.toast('上传成功，请回到文件列表确认入库', 'success');
      } catch (err) {
        ui.done(err.message || '失败', false);
        R2.toast(err.message || '上传失败', 'error');
      }
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    ['dragenter', 'dragover'].forEach((ev) => dropzone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation(); dropzone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach((ev) => dropzone.addEventListener(ev, (e) => {
      e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('dragover');
    }));
    dropzone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files || []);
      if (files[0]) uploadOne(files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files[0]) uploadOne(fileInput.files[0]);
      fileInput.value = '';
    });

    // 支持 ?url= 自动填充并提示
    if (urlInput.value) R2.toast('已识别链接，选择文件即可上传', 'info');
  </script>
  <nav class="bottomnav public-nav" aria-label="页面操作">
    <button class="tabbar-item" type="button" data-theme-toggle aria-label="切换主题">
      <svg class="tt-sun" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="tt-moon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <span class="tt-label">主题</span>
    </button>
    <a class="tabbar-item" href="#upload-card" onclick="return scrollToSection('upload-card')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/></svg>
      <span>上传</span>
    </a>
    <a class="tabbar-item" href="javascript:void(0)" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V8"/><path d="m7 13 5-5 5 5"/><path d="M5 4h14"/></svg>
      <span>顶部</span>
    </a>
  </nav>
  <script>
    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return false;
    }
  </script>
</body>
</html>
