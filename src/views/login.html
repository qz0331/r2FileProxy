<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <title>登录 · R2 Proxy</title>
  <link rel="stylesheet" href="{{ .basePath }}/static/app.css?v=e3b43c1e">
  <script>
    // 主题初始化：在样式渲染前应用，避免深色模式闪白
    (function () {
      try {
        var t = localStorage.getItem('r2proxy-theme') || 'auto';
        if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>

</head>
<body>
  <button class="theme-toggle floating" type="button" data-theme-toggle aria-label="切换主题">
    <svg width="18" height="18" class="tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg width="18" height="18" class="tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg width="18" height="18" class="tt-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    <span class="tt-label">跟随系统</span>
  </button>

  <div class="auth-shell">
    <!-- 左侧品牌区（平板/手机上隐藏） -->
    <aside class="auth-side">
      <div style="position:relative;z-index:1;display:flex;align-items:center;gap:10px">
        <span class="brand-logo">R2</span>
        <span class="brand-text" style="font-size:18px">R2 Proxy</span>
      </div>

      <div class="auth-hero">
        <h1>把 Cloudflare R2<br>变成你的私人网盘</h1>
        <p>直连 R2 的签名上传与下载，不占用服务器带宽；内置临时授权与设备分享链接，手机、平板、电脑都能随时收发文件。</p>

        <div class="auth-features">
          <div class="auth-feature">
            <span class="af-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span>
            <div><b>直传不中转</b>浏览器直接 PUT 到 R2，大文件也稳</div>
          </div>
          <div class="auth-feature">
            <span class="af-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 20"/></svg></span>
            <div><b>设备分享链接</b>一条 Sign PUT 链接，其他设备直接上传</div>
          </div>
          <div class="auth-feature">
            <span class="af-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <div><b>安全可控</b>API Key 支持 IP 白名单，登录失败自动锁定</div>
          </div>
        </div>
      </div>

      <div class="auth-side-foot">R2 Proxy · 基于 Cloudflare R2 的对象存储代理</div>
    </aside>

    <!-- 右侧登录表单 -->
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-mobile-brand">
          <span class="brand-logo">R2</span>
          <span class="brand-text">R2 Proxy</span>
        </div>

        <h2>欢迎回来</h2>
        <p class="sub">登录后即可管理文件、分享上传链接</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label class="label" for="username">用户名</label>
            <div class="input-with-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input class="input" id="username" name="username" type="text" autocomplete="username"
                     placeholder="请输入用户名" required minlength="3" maxlength="64" autocapitalize="off" spellcheck="false">
            </div>
          </div>

          <div class="field">
            <label class="label" for="password">密码</label>
            <div class="input-with-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="input" id="password" name="password" type="password" autocomplete="current-password"
                     placeholder="请输入密码" required minlength="6" style="padding-right:44px">
              <button type="button" id="toggle-password" aria-label="显示密码"
                      style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--text-muted);cursor:pointer;padding:8px;display:grid;place-items:center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div id="login-error" class="alert alert-danger" hidden></div>

          <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit-btn">
            <span>登录</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </form>

        <p class="hint" style="margin-top:18px;text-align:center">
          API 调用请使用 <span class="kbd">X-API-Key</span> 请求头，无需登录
        </p>
      </div>
    </main>
  </div>

  <script src="{{ .basePath }}/static/app.js?v=20651110"></script>
  <script>
    const BASE_PATH = '{{ .basePath }}';
    const NEXT = '{{ .next }}';

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('submit-btn');

    document.getElementById('toggle-password').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;

      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) {
        showError('请输入用户名和密码');
        return;
      }

      R2.setBusy(submitBtn, true, '登录中…');
      try {
        const query = NEXT ? '?next=' + encodeURIComponent(NEXT) : '';
        const result = await R2.request(BASE_PATH + '/login' + query, {
          method: 'POST',
          body: { username, password },
        });

        if (result.must_change_password) {
          sessionStorage.setItem('must_change_password', 'true');
          location.href = BASE_PATH + '/settings';
        } else {
          location.href = BASE_PATH + (result.redirect || '/');
        }
      } catch (err) {
        showError(err.message);
        R2.setBusy(submitBtn, false);
      }
    });
  </script>
</body>
</html>
